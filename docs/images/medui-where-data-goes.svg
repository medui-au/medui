<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Where data goes: MedUI runs inside the practice and reads Best Practice read-only; full text goes only to local models, a cloud model gets redacted text, cloud speech-to-text gets audio as it is, and drafts reach Best Practice only through the user."><title>Where data goes: MedUI runs inside the practice and reads Best Practice read-only; full text goes only to local models, a cloud model gets redacted text, cloud speech-to-text gets audio as it is, and drafts reach Best Practice only through the user.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .bg{fill:#ffffff} .ink{fill:#1f2328} .soft{fill:#59636e} .box{fill:#f6f8fa;stroke:#8c959f} .zone{fill:none;stroke:#8c959f} .acc{fill:#e3f0ee;stroke:#0f766e} .acct{fill:#0f766e} .warn{fill:#fdf2e2;stroke:#b45309} .warnt{fill:#b45309} .stop{fill:#fdecea;stroke:#b42318} .stopt{fill:#b42318} .l{stroke:#8c959f;fill:none} .la{stroke:#0f766e;fill:none} .lw{stroke:#b45309;fill:none} .ls{stroke:#b42318;fill:none} .mk{fill:#8c959f} .mka{fill:#0f766e} .mkw{fill:#b45309} .mks{fill:#b42318} @media (prefers-color-scheme: dark){.bg{fill:#0d1117} .ink{fill:#e6edf3} .soft{fill:#9da7b3} .box{fill:#161b22;stroke:#6e7681} .zone{fill:none;stroke:#6e7681} .acc{fill:#0f2f2c;stroke:#2dd4bf} .acct{fill:#2dd4bf} .warn{fill:#3a2a12;stroke:#f0a54a} .warnt{fill:#f0a54a} .stop{fill:#3d1614;stroke:#ff7b72} .stopt{fill:#ff7b72} .l{stroke:#6e7681;fill:none} .la{stroke:#2dd4bf;fill:none} .lw{stroke:#f0a54a;fill:none} .ls{stroke:#ff7b72;fill:none} .mk{fill:#6e7681} .mka{fill:#2dd4bf} .mkw{fill:#f0a54a} .mks{fill:#ff7b72}}</style><defs><marker id="mke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="mks" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk"/></marker><marker id="mkae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker><marker id="mkas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mka"/></marker><marker id="mkwe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker><marker id="mkws" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mkw"/></marker><marker id="mkse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mks"/></marker><marker id="mkss" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mks"/></marker></defs><rect width="100%" height="100%" class="bg"/><rect x="16" y="40" width="708" height="560" rx="14" class="zone" stroke-width="1.4" stroke-dasharray="6 5"/><text x="32" y="30" font-size="12" class="acct" text-anchor="start" font-weight="700">INSIDE THE PRACTICE</text><rect x="752" y="40" width="232" height="560" rx="14" class="zone" stroke-width="1.4" stroke-dasharray="6 5"/><text x="768" y="30" font-size="12" class="warnt" text-anchor="start" font-weight="700">OUTSIDE (CLOUD)</text><rect x="40" y="80" width="190" height="76" rx="8" class="box" stroke-width="1.4"/><text x="135.0" y="114.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">Health professional</text><text x="135.0" y="131.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">browser on a workstation</text><rect x="40" y="430" width="190" height="86" rx="8" class="box" stroke-width="1.4"/><text x="135.0" y="461.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">Best Practice</text><text x="135.0" y="478.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">SQL Server</text><text x="135.0" y="495.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">the record of truth</text><rect x="290" y="80" width="410" height="290" rx="12" class="box" stroke-width="1.4"/><text x="495" y="106" font-size="14" class="ink" text-anchor="middle" font-weight="700">MedUI</text><text x="495" y="124" font-size="12" class="soft" text-anchor="middle" font-weight="400">on the practice’s server (Docker)</text><rect x="310" y="142" width="180" height="66" rx="8" class="box" stroke-width="1.4"/><text x="400.0" y="171.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">Workflows</text><text x="400.0" y="188.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">screens, chats, scribe</text><rect x="500" y="142" width="180" height="66" rx="8" class="acc" stroke-width="1.4"/><text x="590.0" y="171.0" font-size="13" class="acct" text-anchor="middle" font-weight="600">Redact · check</text><text x="590.0" y="188.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">restore names in reply</text><rect x="310" y="222" width="180" height="66" rx="8" class="box" stroke-width="1.4"/><text x="400.0" y="251.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">MedUI database</text><text x="400.0" y="268.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">settings, runs, chats</text><rect x="500" y="222" width="180" height="66" rx="8" class="box" stroke-width="1.4"/><text x="590.0" y="251.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">OCR (LiteParse)</text><text x="590.0" y="268.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">local, scanned documents</text><rect x="310" y="302" width="370" height="50" rx="8" class="box" stroke-width="1.4"/><text x="495.0" y="331.0" font-size="12.5" class="ink" text-anchor="middle" font-weight="600">Draft for the health professional to review</text><rect x="290" y="430" width="190" height="86" rx="8" class="acc" stroke-width="1.4"/><text x="385.0" y="469.0" font-size="13" class="acct" text-anchor="middle" font-weight="600">Local AI models</text><text x="385.0" y="486.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">on practice equipment</text><rect x="510" y="430" width="190" height="86" rx="8" class="box" stroke-width="1.4"/><text x="605.0" y="469.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">BP incoming folder</text><text x="605.0" y="486.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">PIT files, shared</text><rect x="772" y="120" width="192" height="76" rx="8" class="warn" stroke-width="1.4"/><text x="868.0" y="154.0" font-size="13" class="warnt" text-anchor="middle" font-weight="600">Cloud AI model</text><text x="868.0" y="171.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">the practice’s provider</text><rect x="772" y="262" width="192" height="76" rx="8" class="warn" stroke-width="1.4"/><text x="868.0" y="296.0" font-size="13" class="warnt" text-anchor="middle" font-weight="600">Cloud speech-to-text</text><text x="868.0" y="313.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">scribe audio, optional</text><rect x="772" y="404" width="192" height="76" rx="8" class="box" stroke-width="1.4"/><text x="868.0" y="438.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">SMS / email gateway</text><text x="868.0" y="455.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">messages to patients</text><polyline points="230,118 288,118" class="l" stroke-width="1.6" marker-end="url(#mke)" marker-start="url(#mks)"/><text x="259" y="108" font-size="11" class="soft" text-anchor="middle" font-weight="400">HTTPS</text><text x="259" y="136" font-size="11" class="soft" text-anchor="middle" font-weight="400">BP login</text><polyline points="135,428 135,330 288,330" class="l" stroke-width="1.6" marker-end="url(#mke)"/><text x="143" y="382" font-size="12" class="ink" text-anchor="start" font-weight="600">reads only</text><text x="143" y="398" font-size="11" class="soft" text-anchor="start" font-weight="400">login checked</text><text x="143" y="412" font-size="11" class="soft" text-anchor="start" font-weight="400">read-only at start</text><polyline points="72,158 72,428" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><text x="80" y="250" font-size="11" class="soft" text-anchor="start" font-weight="400">user pastes</text><text x="80" y="264" font-size="11" class="soft" text-anchor="start" font-weight="400">or files</text><text x="80" y="278" font-size="11" class="soft" text-anchor="start" font-weight="400">the draft</text><polyline points="385,372 385,428" class="la" stroke-width="1.6" marker-end="url(#mkae)" marker-start="url(#mkas)"/><text x="393" y="396" font-size="11" class="acct" text-anchor="start" font-weight="600">full text,</text><text x="393" y="410" font-size="11" class="acct" text-anchor="start" font-weight="600">stays inside</text><polyline points="605,372 605,428" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><text x="613" y="396" font-size="11" class="soft" text-anchor="start" font-weight="400">user files</text><text x="613" y="410" font-size="11" class="soft" text-anchor="start" font-weight="400">a draft (PIT)</text><polyline points="605,518 605,560 135,560 135,520" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><text x="370" y="552" font-size="11" class="soft" text-anchor="middle" font-weight="400">Best Practice imports it to the user’s inbox</text><polyline points="682,162 770,150" class="la" stroke-width="1.6" marker-end="url(#mkae)"/><rect x="696.6" y="129.0" width="58.9" height="16" rx="3" class="bg"/><text x="726" y="140" font-size="11" class="acct" text-anchor="middle" font-weight="600">redacted</text><polyline points="770,172 682,184" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="707.0" y="187.0" width="38.0" height="16" rx="3" class="bg"/><text x="726" y="198" font-size="11" class="soft" text-anchor="middle" font-weight="400">reply</text><polyline points="702,300 770,300" class="lw" stroke-width="2" marker-end="url(#mkwe)"/><rect x="706.6" y="279.0" width="58.9" height="16" rx="3" class="bg"/><text x="736" y="290" font-size="11" class="warnt" text-anchor="middle" font-weight="600">audio as</text><rect x="706.6" y="307.0" width="58.9" height="16" rx="3" class="bg"/><text x="736" y="318" font-size="11" class="warnt" text-anchor="middle" font-weight="600">recorded</text><polyline points="702,352 740,352 740,442 770,442" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><rect x="715.0" y="375.0" width="50.0" height="16" rx="3" class="bg"/><text x="740" y="386" font-size="11" class="soft" text-anchor="middle" font-weight="400">sent by</text><rect x="712.0" y="389.0" width="56.0" height="16" rx="3" class="bg"/><text x="740" y="400" font-size="11" class="soft" text-anchor="middle" font-weight="400">a person</text></svg>
