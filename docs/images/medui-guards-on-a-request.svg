<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="The guards on one AI request: the security pre-check refuses a cloud model for anything not fully redacted, the privacy check looks at what will be sent, the user can be asked to remove details first, names are restored inside MedUI, and the result is a draft for review."><title>The guards on one AI request: the security pre-check refuses a cloud model for anything not fully redacted, the privacy check looks at what will be sent, the user can be asked to remove details first, names are restored inside MedUI, and the result is a draft for review.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .bg{fill:#ffffff} .ink{fill:#1f2328} .soft{fill:#59636e} .box{fill:#f6f8fa;stroke:#8c959f} .zone{fill:none;stroke:#8c959f} .acc{fill:#e3f0ee;stroke:#0f766e} .acct{fill:#0f766e} .warn{fill:#fdf2e2;stroke:#b45309} .warnt{fill:#b45309} .stop{fill:#fdecea;stroke:#b42318} .stopt{fill:#b42318} .l{stroke:#8c959f;fill:none} .la{stroke:#0f766e;fill:none} .lw{stroke:#b45309;fill:none} .ls{stroke:#b42318;fill:none} .mk{fill:#8c959f} .mka{fill:#0f766e} .mkw{fill:#b45309} .mks{fill:#b42318} @media (prefers-color-scheme: dark){.bg{fill:#0d1117} .ink{fill:#e6edf3} .soft{fill:#9da7b3} .box{fill:#161b22;stroke:#6e7681} .zone{fill:none;stroke:#6e7681} .acc{fill:#0f2f2c;stroke:#2dd4bf} .acct{fill:#2dd4bf} .warn{fill:#3a2a12;stroke:#f0a54a} .warnt{fill:#f0a54a} .stop{fill:#3d1614;stroke:#ff7b72} .stopt{fill:#ff7b72} .l{stroke:#6e7681;fill:none} .la{stroke:#2dd4bf;fill:none} .lw{stroke:#f0a54a;fill:none} .ls{stroke:#ff7b72;fill:none} .mk{fill:#6e7681} .mka{fill:#2dd4bf} .mkw{fill:#f0a54a} .mks{fill:#ff7b72}}</style><defs><marker id="mke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="mks" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk"/></marker><marker id="mkae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker><marker id="mkas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mka"/></marker><marker id="mkwe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker><marker id="mkws" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mkw"/></marker><marker id="mkse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mks"/></marker><marker id="mkss" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mks"/></marker></defs><rect width="100%" height="100%" class="bg"/><rect x="240" y="40" width="370" height="64" rx="8" class="box" stroke-width="1.4"/><text x="425.0" y="68.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">1  Start a workflow</text><text x="425.0" y="85.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">doctor or administrator, by BP group; AI switched on</text><rect x="240" y="140" width="370" height="64" rx="8" class="acc" stroke-width="1.4"/><text x="425.0" y="168.0" font-size="13" class="acct" text-anchor="middle" font-weight="600">2  Assemble the data</text><text x="425.0" y="185.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">reads BP; removes identifiers by the workflow’s policy</text><rect x="240" y="240" width="370" height="64" rx="8" class="acc" stroke-width="1.4"/><text x="425.0" y="268.0" font-size="13" class="acct" text-anchor="middle" font-weight="600">3  Security pre-check</text><text x="425.0" y="285.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">the workflow’s policy against the model chosen</text><rect x="240" y="340" width="370" height="64" rx="8" class="acc" stroke-width="1.4"/><text x="425.0" y="368.0" font-size="13" class="acct" text-anchor="middle" font-weight="600">4  Privacy check (cloud only)</text><text x="425.0" y="385.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">looks at the prompt exactly as it will be sent</text><rect x="240" y="440" width="370" height="64" rx="8" class="box" stroke-width="1.4"/><text x="425.0" y="468.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">5  The model</text><text x="425.0" y="485.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">local: on practice equipment · cloud: the provider</text><rect x="240" y="540" width="370" height="64" rx="8" class="box" stroke-width="1.4"/><text x="425.0" y="568.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">6  Restore names</text><text x="425.0" y="585.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">done inside MedUI, never by the provider</text><rect x="240" y="640" width="370" height="64" rx="8" class="box" stroke-width="1.4"/><text x="425.0" y="668.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">7  Draft for review</text><text x="425.0" y="685.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">the health professional reviews, edits, saves to BP</text><polyline points="425.0,104 425.0,138" class="l" stroke-width="1.6" marker-end="url(#mke)"/><polyline points="425.0,204 425.0,238" class="l" stroke-width="1.6" marker-end="url(#mke)"/><polyline points="425.0,304 425.0,338" class="la" stroke-width="1.6" marker-end="url(#mkae)"/><text x="433.0" y="326" font-size="11" class="acct" text-anchor="start" font-weight="600">cloud model</text><polyline points="425.0,404 425.0,438" class="l" stroke-width="1.6" marker-end="url(#mke)"/><polyline points="425.0,504 425.0,538" class="l" stroke-width="1.6" marker-end="url(#mke)"/><polyline points="425.0,604 425.0,638" class="l" stroke-width="1.6" marker-end="url(#mke)"/><polyline points="240,272.0 180,272.0 180,472.0 238,472.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><text x="172" y="366" font-size="11" class="ink" text-anchor="end" font-weight="600">local model</text><text x="172" y="380" font-size="11" class="soft" text-anchor="end" font-weight="400">full text allowed;</text><text x="172" y="394" font-size="11" class="soft" text-anchor="end" font-weight="400">nothing leaves</text><rect x="690" y="232" width="290" height="80" rx="8" class="stop" stroke-width="1.4"/><text x="835.0" y="260.0" font-size="13" class="stopt" text-anchor="middle" font-weight="600">Refused, not sent</text><text x="835.0" y="277.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">not fully redacted → cloud model</text><text x="835.0" y="294.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">or the patient’s identifiers didn’t load</text><polyline points="610,272.0 688,272.0" class="ls" stroke-width="1.6" marker-end="url(#mkse)"/><rect x="690" y="332" width="290" height="96" rx="8" class="warn" stroke-width="1.4"/><text x="835.0" y="360.0" font-size="13" class="warnt" text-anchor="middle" font-weight="600">Paused for the user</text><text x="835.0" y="377.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">on screens that show the review:</text><text x="835.0" y="394.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">patient’s or a practitioner’s details,</text><text x="835.0" y="411.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">or the user reviews every request</text><polyline points="610,362 688,362" class="lw" stroke-width="1.6" marker-end="url(#mkwe)"/><polyline points="730,428 730,472 612,472" class="lw" stroke-width="1.6" marker-end="url(#mkwe)"/><text x="738" y="452" font-size="11" class="warnt" text-anchor="start" font-weight="400">user removes them;</text><text x="738" y="466" font-size="11" class="warnt" text-anchor="start" font-weight="400">checked again, then sent</text><rect x="690" y="530" width="290" height="66" rx="8" class="box" stroke-width="1.4"/><text x="835.0" y="551.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">Run record</text><text x="835.0" y="568.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">identifiable: kept for the practice’s period</text><text x="835.0" y="585.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">then removed with Purge</text><rect x="690" y="634" width="290" height="66" rx="8" class="box" stroke-width="1.4"/><text x="835.0" y="655.0" font-size="13" class="ink" text-anchor="middle" font-weight="600">Usage record</text><text x="835.0" y="672.0" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">who, when, which model, local or cloud</text><text x="835.0" y="689.0" font-size="12" class="soft" text-anchor="middle" font-weight="400">no patient details; kept</text><polyline points="610,572.0 688,563" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><polyline points="610,672.0 688,667" class="l" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mke)"/><text x="232" y="24" font-size="12" class="soft" text-anchor="start" font-weight="400">One workflow run, top to bottom</text></svg>
