<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Switches and fixed guards: a cloud AI request passes switches set by IT, Best Practice, the practice and the user, and fixed guards that no setting turns off; no switch sends text that is not fully redacted to a cloud model."><title>Switches and fixed guards: a cloud AI request passes switches set by IT, Best Practice, the practice and the user, and fixed guards that no setting turns off; no switch sends text that is not fully redacted to a cloud model.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .bg{fill:#ffffff} .ink{fill:#1f2328} .soft{fill:#59636e} .box{fill:#f6f8fa;stroke:#8c959f} .zone{fill:none;stroke:#8c959f} .acc{fill:#e3f0ee;stroke:#0f766e} .acct{fill:#0f766e} .warn{fill:#fdf2e2;stroke:#b45309} .warnt{fill:#b45309} .stop{fill:#fdecea;stroke:#b42318} .stopt{fill:#b42318} .l{stroke:#8c959f;fill:none} .la{stroke:#0f766e;fill:none} .lw{stroke:#b45309;fill:none} .ls{stroke:#b42318;fill:none} .mk{fill:#8c959f} .mka{fill:#0f766e} .mkw{fill:#b45309} .mks{fill:#b42318} @media (prefers-color-scheme: dark){.bg{fill:#0d1117} .ink{fill:#e6edf3} .soft{fill:#9da7b3} .box{fill:#161b22;stroke:#6e7681} .zone{fill:none;stroke:#6e7681} .acc{fill:#0f2f2c;stroke:#2dd4bf} .acct{fill:#2dd4bf} .warn{fill:#3a2a12;stroke:#f0a54a} .warnt{fill:#f0a54a} .stop{fill:#3d1614;stroke:#ff7b72} .stopt{fill:#ff7b72} .l{stroke:#6e7681;fill:none} .la{stroke:#2dd4bf;fill:none} .lw{stroke:#f0a54a;fill:none} .ls{stroke:#ff7b72;fill:none} .mk{fill:#6e7681} .mka{fill:#2dd4bf} .mkw{fill:#f0a54a} .mks{fill:#ff7b72}}</style><defs><marker id="mke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker><marker id="mks" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk"/></marker><marker id="mkae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker><marker id="mkas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mka"/></marker><marker id="mkwe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker><marker id="mkws" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mkw"/></marker><marker id="mkse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mks"/></marker><marker id="mkss" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mks"/></marker></defs><rect width="100%" height="100%" class="bg"/><text x="24" y="30" font-size="13" class="ink" text-anchor="start" font-weight="700">A cloud AI request passes every gate, left to right</text><rect x="19.0" y="56" width="108" height="176" rx="8" class="box" stroke-width="1.4"/><rect x="60.0" y="76" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="79.0" cy="83" r="4.5" class="acct"/><text x="73.0" y="122" font-size="12" class="ink" text-anchor="middle" font-weight="700">AI on</text><text x="73.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">for the</text><text x="73.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">installation</text><text x="73.0" y="216" font-size="11" class="acct" text-anchor="middle" font-weight="600">IT (.env)</text><polyline points="127.0,144.0 140.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="141.0" y="56" width="108" height="176" rx="8" class="box" stroke-width="1.4"/><rect x="182.0" y="76" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="201.0" cy="83" r="4.5" class="acct"/><text x="195.0" y="122" font-size="12" class="ink" text-anchor="middle" font-weight="700">AI allowed</text><text x="195.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">doctors and</text><text x="195.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">administrators</text><text x="195.0" y="216" font-size="11" class="acct" text-anchor="middle" font-weight="600">BP user group</text><polyline points="249.0,144.0 262.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="263.0" y="56" width="108" height="176" rx="8" class="box" stroke-width="1.4"/><rect x="304.0" y="76" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="323.0" cy="83" r="4.5" class="acct"/><text x="317.0" y="122" font-size="12" class="ink" text-anchor="middle" font-weight="700">AI model</text><text x="317.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">provider, model</text><text x="317.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">switched on</text><text x="317.0" y="216" font-size="11" class="acct" text-anchor="middle" font-weight="600">administrator</text><polyline points="371.0,144.0 384.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="385.0" y="56" width="108" height="176" rx="8" class="box" stroke-width="1.4"/><rect x="426.0" y="76" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="445.0" cy="83" r="4.5" class="acct"/><text x="439.0" y="122" font-size="12" class="ink" text-anchor="middle" font-weight="700">Workflow</text><text x="439.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">active; set to</text><text x="439.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">local only?</text><text x="439.0" y="216" font-size="11" class="acct" text-anchor="middle" font-weight="600">administrator</text><polyline points="493.0,144.0 506.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="507.0" y="56" width="108" height="176" rx="8" class="stop" stroke-width="1.4"/><path d="M555.0,79 v-3 a6,6 0 0 1 12,0 v3" class="l" stroke-width="1.8"/><rect x="552.0" y="79" width="18" height="12" rx="2" class="stopt"/><text x="561.0" y="122" font-size="12" class="stopt" text-anchor="middle" font-weight="700">Pre-check</text><text x="561.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">cloud only if</text><text x="561.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">fully redacted</text><text x="561.0" y="216" font-size="11" class="stopt" text-anchor="middle" font-weight="600">always on</text><polyline points="615.0,144.0 628.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="629.0" y="56" width="108" height="176" rx="8" class="stop" stroke-width="1.4"/><path d="M677.0,79 v-3 a6,6 0 0 1 12,0 v3" class="l" stroke-width="1.8"/><rect x="674.0" y="79" width="18" height="12" rx="2" class="stopt"/><text x="683.0" y="122" font-size="12" class="stopt" text-anchor="middle" font-weight="700">Redaction</text><text x="683.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">rules in their</text><text x="683.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">own library</text><text x="683.0" y="216" font-size="11" class="stopt" text-anchor="middle" font-weight="600">always on</text><polyline points="737.0,144.0 750.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="751.0" y="56" width="108" height="176" rx="8" class="stop" stroke-width="1.4"/><path d="M799.0,79 v-3 a6,6 0 0 1 12,0 v3" class="l" stroke-width="1.8"/><rect x="796.0" y="79" width="18" height="12" rx="2" class="stopt"/><text x="805.0" y="122" font-size="12" class="stopt" text-anchor="middle" font-weight="700">Privacy check</text><text x="805.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">runs on every</text><text x="805.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">cloud request</text><text x="805.0" y="216" font-size="11" class="stopt" text-anchor="middle" font-weight="600">always on</text><polyline points="859.0,144.0 872.0,144.0" class="l" stroke-width="1.6" marker-end="url(#mke)"/><rect x="873.0" y="56" width="108" height="176" rx="8" class="box" stroke-width="1.4"/><rect x="914.0" y="76" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="933.0" cy="83" r="4.5" class="acct"/><text x="927.0" y="122" font-size="12" class="ink" text-anchor="middle" font-weight="700">Review first</text><text x="927.0" y="142" font-size="11" class="soft" text-anchor="middle" font-weight="400">every request,</text><text x="927.0" y="157" font-size="11" class="soft" text-anchor="middle" font-weight="400">if the user</text><text x="927.0" y="172" font-size="11" class="soft" text-anchor="middle" font-weight="400">chooses</text><text x="927.0" y="216" font-size="11" class="acct" text-anchor="middle" font-weight="600">each user</text><polyline points="19.0,258 981.0,258" class="la" stroke-width="2" marker-end="url(#mkae)"/><text x="500" y="278" font-size="11.5" class="soft" text-anchor="middle" font-weight="400">then the model, names restored inside MedUI, and a draft for the health professional</text><rect x="24" y="297" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="43" cy="304" r="4.5" class="acct"/><text x="58" y="308" font-size="12" class="ink" text-anchor="start" font-weight="400">a switch: someone decides</text><path d="M255,300 v-3 a6,6 0 0 1 12,0 v3" class="l" stroke-width="1.8"/><rect x="252" y="300" width="18" height="12" rx="2" class="stopt"/><text x="280" y="308" font-size="12" class="stopt" text-anchor="start" font-weight="600">a fixed guard: no setting turns it off</text><rect x="16" y="334" width="968" height="130" rx="12" class="box" stroke-width="1.4"/><text x="36" y="360" font-size="12.5" class="ink" text-anchor="start" font-weight="700">Off until IT or the practice turns them on</text><rect x="36" y="374" width="176.0" height="28" rx="14" class="box" stroke-width="1.4"/><rect x="44" y="381" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="63" cy="388" r="4.5" class="acct"/><text x="76" y="392" font-size="11.5" class="ink" text-anchor="start" font-weight="400">Messages to patients</text><rect x="222.0" y="374" width="149.6" height="28" rx="14" class="box" stroke-width="1.4"/><rect x="230.0" y="381" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="249.0" cy="388" r="4.5" class="acct"/><text x="262.0" y="392" font-size="11.5" class="ink" text-anchor="start" font-weight="400">PIT export to BP</text><rect x="381.6" y="374" width="116.6" height="28" rx="14" class="box" stroke-width="1.4"/><rect x="389.6" y="381" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="408.6" cy="388" r="4.5" class="acct"/><text x="421.6" y="392" font-size="11.5" class="ink" text-anchor="start" font-weight="400">Patient API</text><rect x="508.20000000000005" y="374" width="169.39999999999998" height="28" rx="14" class="box" stroke-width="1.4"/><rect x="516.2" y="381" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="535.2" cy="388" r="4.5" class="acct"/><text x="548.2" y="392" font-size="11.5" class="ink" text-anchor="start" font-weight="400">Privacy Review page</text><rect x="687.6" y="374" width="129.8" height="28" rx="14" class="box" stroke-width="1.4"/><rect x="695.6" y="381" width="26" height="14" rx="7" class="acc" stroke-width="1.4"/><circle cx="714.6" cy="388" r="4.5" class="acct"/><text x="727.6" y="392" font-size="11.5" class="ink" text-anchor="start" font-weight="400">Staff privacy</text><text x="36" y="430" font-size="12" class="stopt" text-anchor="start" font-weight="700">Always on, whatever is switched:</text><text x="272" y="430" font-size="12" class="ink" text-anchor="start" font-weight="400">read-only Best Practice connection · CSRF and login checks ·</text><text x="272" y="448" font-size="12" class="ink" text-anchor="start" font-weight="400">no workflow can point text that isn’t fully redacted at a cloud model</text></svg>
