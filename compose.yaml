name: ${COMPOSE_PROJECT_NAME:-medui_os}
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medui}
      POSTGRES_USER: ${POSTGRES_USER:-medui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  liteparse:
    profiles: [ocr]
    build:
      # Upstream's server at a pinned commit, built with LiteParse 2.20.0: see docker/liteparse/.
      context: ./docker/liteparse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCR_PORT:-5707}:5707"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5707/parse',{method:'POST'}).then(r=>process.exit(r.status===400?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medui}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medui}
      OCR_SERVICE_URL: ${OCR_CONTAINER_URL:-http://liteparse:5707}
      # The container's local time is the practice's: "today" on the day sheet and elsewhere.
      TZ: ${PRACTICE_TIMEZONE:-Australia/Brisbane}
      PIT_CONTAINER_DIR: /pit   # Setup → Messaging names this folder in its hint
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-5005}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/instance
      # Best Practice's PIT folder: its incoming share, mounted on this computer by ./medui.sh pit
      # (PIT_HOST_DIR in .env) and shown to the app as /pit. Unset, ./pit is an empty folder the app
      # can't write to, so sending to BP fails with a reason instead of writing where BP never reads.
      - ${PIT_HOST_DIR:-./pit}:/pit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
  bpsql:
    # Demo installations only (install.sh --demo): SQL Server Express holding MedUI's invented
    # demo databases (medui_demodata) in Best Practice's layout, as BPSDB_HOST=bpsql. It has no
    # port on this computer: only this installation's containers reach it. Never real BP data.
    profiles: [demo]
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR2-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${DEMO_SQL_ACCEPT_EULA:-N}   # Y only once the person installing accepted Microsoft's terms
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DEMO_SQL_SA_PASSWORD:-}
      MSSQL_MEMORY_LIMIT_MB: ${DEMO_SQL_MEMORY_MB:-2048}
      TZ: ${PRACTICE_TIMEZONE:-Australia/Brisbane}
    volumes:
      - bpsql_data:/var/opt/mssql
      - ./scripts/demo_mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
  caddy:
    # HTTPS for workstations (docs/https.md). install.sh --https writes ./https/Caddyfile and,
    # unless the practice supplies its own certificate, a name-restricted root in ./https/ca.
    profiles: [https]
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./https:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
  bpsql_data:
