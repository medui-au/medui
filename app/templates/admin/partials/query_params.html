{% if system_params_used %}
<div style="margin-bottom:0.5rem;">
    <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
                color:var(--text-muted); margin-bottom:0.25rem;">Auto-injected</div>
    {% for p in system_params_used %}
    <span style="display:inline-block; background:var(--info); color:#fff; font-size:0.68rem;
                 padding:0.1rem 0.4rem; border-radius:0.2rem; margin:0.1rem;">:{{ p }}</span>
    {% endfor %}
</div>
{% endif %}

{% if parameters %}
<div style="margin-top:0.4rem;">
    <div style="font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
                color:var(--text-muted); margin-bottom:0.3rem;">Parameters</div>
    {% for p in parameters %}
    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;">
        <label style="font-size:var(--text-sm); width:130px; flex-shrink:0;">:{{ p }}</label>
        <input type="text" name="param_{{ p }}" placeholder="{{ p }}"
               style="flex:1; padding:0.25rem 0.4rem; border:1px solid var(--border-color);
                      border-radius:var(--radius-sm); background:var(--bg-primary);
                      color:var(--text-primary); font-size:var(--text-sm);">
    </div>
    {% endfor %}
</div>
{% endif %}

{% if not parameters and not system_params_used %}
<p style="color:var(--text-muted); font-size:var(--text-sm); margin:0;">No parameters detected.</p>
{% endif %}
