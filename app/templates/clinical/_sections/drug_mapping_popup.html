{# Drug mapping popup — loaded into #med-mapping-dialog-body via HTMX #}
<form hx-post="{{ url_for('clinical.med_mapping_approve', patient_id=patient_id) }}"
      hx-target="#med-mapping-dialog-body"
      hx-swap="innerHTML"
      hx-include="[name='csrf_token']">
  <input type="hidden" name="product_id"  value="{{ product_id }}">
  <input type="hidden" name="brand_name"  value="{{ brand_name }}">

  <p class="text-xs text-muted" style="margin-bottom:0.15rem;">Brand / MIMS name</p>
  <p class="fw-500" style="margin-bottom:var(--space-3);">{{ brand_name }}</p>

  {% if not existing %}
  <p id="pbs-spinner" class="text-xs text-muted" style="margin-bottom:var(--space-2);">Looking up PBS…</p>
  {% endif %}

  <label style="display:block; margin-bottom:var(--space-2);">
    <span class="text-xs text-muted">Generic name</span>
    <input id="med-generic" type="text" name="generic_name"
           value="{{ existing.generic_name if existing else '' }}"
           required autofocus style="width:100%;">
  </label>

  <label style="display:block; margin-bottom:var(--space-3);">
    <span class="text-xs text-muted">ATC code (optional)</span>
    <input id="med-atc" type="text" name="atc_code"
           value="{{ existing.atc_code or suggested_atc or '' if existing else '' }}"
           placeholder="e.g. C10AA05" style="width:100%;">
  </label>

  <div style="display:flex; gap:var(--space-2); justify-content:flex-end;">
    <button type="button" class="btn btn-outline btn-sm"
            onclick="document.getElementById('med-mapping-dialog').close()">Skip</button>
    <button type="submit" class="btn btn-primary btn-sm">Approve</button>
  </div>
</form>

{% if not existing %}
<script>
(function () {
  var brand = {{ brand_name | tojson }};
  var spinner = document.getElementById('pbs-spinner');
  fetch('/clinical/api/pbs-suggest?brand=' + encodeURIComponent(brand))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (spinner) spinner.hidden = true;
      var g = document.getElementById('med-generic');
      var a = document.getElementById('med-atc');
      if (g && d.generic_name) g.value = d.generic_name;
      if (a && d.atc_code)     a.value = d.atc_code;
    })
    .catch(function () { if (spinner) spinner.hidden = true; });
})();
</script>
{% endif %}
