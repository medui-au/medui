{% for sp in system_prompts %}
<div class="pm-list-item"
     data-id="sys-{{ sp.id }}"
     onclick="loadSystemEditor({{ sp.id }})"
     style="padding:0.4rem 0.75rem; border-bottom:1px solid var(--border-color); cursor:pointer; user-select:none;">
    <div style="display:flex; align-items:center; gap:0.4rem;">
        <span style="font-size:var(--text-sm); font-weight:500; flex:1;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            {{ sp.name }}
        </span>
        <span style="font-size:0.6rem; color:var(--text-muted);">v{{ sp.version }}</span>
        {% if sp.is_default %}
        <span style="font-size:0.6rem; background:var(--accent); color:#fff;
                     padding:0.05rem 0.3rem; border-radius:0.2rem;">DEFAULT</span>
        {% endif %}
    </div>
    {% if sp.description %}
    <div style="font-size:0.65rem; color:var(--text-muted); white-space:nowrap;
                overflow:hidden; text-overflow:ellipsis; margin-top:0.1rem;">
        {{ sp.description }}
    </div>
    {% endif %}
</div>
{% else %}
<p style="padding:0.75rem; color:var(--text-muted); font-size:var(--text-sm);">No system prompts yet.</p>
{% endfor %}
