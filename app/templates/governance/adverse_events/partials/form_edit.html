<form method="post" action="{{ url_for('governance.ae_save', event_id=event.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3 style="font-size:0.95rem; font-weight:700; margin:0 0 1rem;">Edit {{ event.reference_no }}</h3>

    <div class="gov-field">
        <label class="gov-field-label" for="aee-title">Title</label>
        <input id="aee-title" name="title" type="text" class="filter-input"
               value="{{ event.title }}" required maxlength="500">
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="aee-location">Location</label>
        <input id="aee-location" name="location" type="text" class="filter-input"
               value="{{ event.location or '' }}">
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="aee-description">Description</label>
        <textarea id="aee-description" name="description" rows="5" class="filter-input" required>{{ event.description }}</textarea>
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="aee-immediate">Immediate Actions Taken</label>
        <textarea id="aee-immediate" name="immediate_actions" rows="3" class="filter-input">{{ event.immediate_actions or '' }}</textarea>
    </div>

    <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('governance.ae_detail', event_id=event.id) }}"
           hx-get="{{ url_for('governance.ae_detail', event_id=event.id) }}"
           hx-target="#ae-detail-panel" hx-swap="innerHTML"
           class="btn btn-outline">Cancel</a>
    </div>
</form>
