<form method="post" action="{{ url_for('governance.ae_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3 style="font-size:0.95rem; font-weight:700; margin:0 0 1rem;">Report Adverse Event / Near Miss</h3>

    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <div class="gov-field" style="flex:1; min-width:140px;">
            <label class="gov-field-label" for="ae-type">Event Type <span style="color:var(--danger);">*</span></label>
            <select id="ae-type" name="event_type" class="filter-select" required>
                <option value="">— select —</option>
                {% for t in event_types %}
                <option value="{{ t.value }}">{{ t.value.replace('_',' ').title() }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="gov-field" style="flex:1; min-width:140px;">
            <label class="gov-field-label" for="ae-sev">Initial Severity (SAC) <span style="color:var(--danger);">*</span></label>
            <select id="ae-sev" name="severity" class="filter-select" required
                    onchange="_aeUpdateDisclosureDefault()">
                <option value="">— select —</option>
                {% for s in severities %}
                <option value="{{ s.value }}">{{ s.value.replace('_',' ').title() }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-involved-type">Involved Person Type <span style="color:var(--danger);">*</span></label>
        <select id="ae-involved-type" name="involved_person_type" class="filter-select" required
                onchange="document.getElementById('ae-patient-block').style.display=this.value==='patient'?'block':'none';document.getElementById('ae-external-block').style.display=(this.value!=='patient'&&this.value!=='')?'block':'none';_aeUpdateDisclosureDefault();">
            <option value="">— select —</option>
            {% for t in involved_person_types %}
            <option value="{{ t.value }}">{{ t.value.replace('_',' ').title() }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="gov-field" style="display:flex; align-items:center; gap:0.4rem;">
        <input id="ae-od-required" name="open_disclosure_required" type="checkbox" value="1">
        <label for="ae-od-required" style="font-size:var(--text-sm); margin:0;">Open disclosure required</label>
    </div>
    <div style="font-size:0.75rem; color:var(--text-muted); margin:-0.5rem 0 0.75rem;">
        Auto-suggested for SAC 1–3 events involving a patient — adjust if needed.
    </div>
    <div id="ae-patient-block" style="display:none;" class="gov-field">
        <label class="gov-field-label" for="ae-patient-id">Patient ID (BPSDB InternalId)</label>
        <input id="ae-patient-id" name="patient_id" type="number" class="filter-input" placeholder="e.g. 12345">
    </div>
    <div id="ae-external-block" style="display:none;">
        <div class="gov-field">
            <label class="gov-field-label" for="ae-external-name">Name</label>
            <input id="ae-external-name" name="external_name" type="text" class="filter-input">
        </div>
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-title">Brief Title <span style="color:var(--danger);">*</span></label>
        <input id="ae-title" name="title" type="text" class="filter-input" required maxlength="500">
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-occurred">Date / Time Occurred <span style="color:var(--danger);">*</span></label>
        <input id="ae-occurred" name="occurred_at" type="datetime-local" class="filter-input" required>
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-location">Location</label>
        <input id="ae-location" name="location" type="text" class="filter-input" placeholder="e.g. Treatment Room 2">
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-description">Full Description <span style="color:var(--danger);">*</span></label>
        <textarea id="ae-description" name="description" rows="4" class="filter-input" required></textarea>
    </div>

    <div class="gov-field">
        <label class="gov-field-label" for="ae-immediate">Immediate Actions Taken</label>
        <textarea id="ae-immediate" name="immediate_actions" rows="2" class="filter-input"></textarea>
    </div>

    <div style="display:flex; gap:0.5rem; margin-top:1rem;">
        <button type="submit" class="btn btn-primary">Submit Report</button>
        <button type="button" class="btn btn-outline"
                onclick="document.getElementById('ae-detail-panel').innerHTML='<div class=gov-detail-empty>Select an event to view details</div>';">
            Cancel
        </button>
    </div>
</form>
<script>
function _aeUpdateDisclosureDefault(){
    var sev = document.getElementById('ae-sev').value;
    var inv = document.getElementById('ae-involved-type').value;
    var required = ['sac1_catastrophic','sac2_major','sac3_moderate'].indexOf(sev) !== -1 && inv === 'patient';
    document.getElementById('ae-od-required').checked = required;
}
</script>
